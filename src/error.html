<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<title>Page indisponible · Coursely</title>
		<style>
			:root {
				color-scheme: light dark;
				--background: oklch(1 0 0);
				--foreground: oklch(0.145 0 0);
				--muted: oklch(0.5 0 0);
				--border: oklch(0.922 0 0);
				--sidebar: oklch(0.985 0 0);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				font-family: system-ui, sans-serif;
				color: var(--foreground);
				background: var(--background);
			}
			header {
				background: var(--sidebar);
				border-bottom: 1px solid var(--border);
			}
			.header-inner,
			main {
				max-width: 80rem;
				margin: auto;
				padding-inline: max(1.25rem, env(safe-area-inset-left))
					max(1.25rem, env(safe-area-inset-right));
			}
			.header-inner {
				display: flex;
				align-items: center;
				min-height: 4.5rem;
				padding-top: env(safe-area-inset-top);
				font-size: 1.25rem;
				font-weight: 600;
				letter-spacing: -0.025em;
			}
			main {
				padding-top: clamp(3.5rem, 11svh, 7rem);
				padding-bottom: calc(4rem + env(safe-area-inset-bottom));
			}
			.content {
				max-width: 41rem;
				overflow-wrap: anywhere;
			}
			.status {
				display: inline-flex;
				min-height: 1.75rem;
				align-items: center;
				padding: 0.25rem 0.625rem;
				border: 1px solid var(--border);
				border-radius: 9999px;
				font-size: 0.75rem;
				color: var(--muted);
			}
			h1 {
				margin: 1.5rem 0 1.25rem;
				font-size: clamp(1.875rem, 4vw, 2.25rem);
				line-height: 1.15;
				letter-spacing: -0.025em;
				text-wrap: balance;
			}
			p {
				line-height: 1.65;
				color: var(--muted);
			}
			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
				margin-top: 2.5rem;
				border-top: 1px solid var(--border);
				padding-top: 1.75rem;
			}
			a {
				color: inherit;
				text-underline-offset: 0.2em;
				touch-action: manipulation;
			}
			.button {
				min-height: 2.75rem;
				padding: 0.75rem 1rem;
				border: 1px solid var(--border);
				border-radius: 1.625rem;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				text-decoration: none;
				font-size: 0.875rem;
				font-weight: 600;
			}
			.primary {
				color: var(--background);
				background: var(--foreground);
				border-color: var(--foreground);
			}
			a:focus-visible {
				outline: 3px solid var(--foreground);
				outline-offset: 4px;
			}
			.skip {
				position: fixed;
				top: 1rem;
				left: 1rem;
				transform: translateY(-200%);
				padding: 0.75rem 1rem;
				background: var(--background);
				border-radius: 0.625rem;
			}
			.skip:focus {
				transform: none;
			}
			::selection {
				color: var(--background);
				background: var(--foreground);
			}
			@media (max-width: 25rem) {
				.actions {
					flex-direction: column;
				}
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: oklch(0.145 0 0);
					--foreground: oklch(0.985 0 0);
					--muted: oklch(0.708 0 0);
					--border: oklch(1 0 0 / 10%);
					--sidebar: oklch(0.205 0 0);
				}
			}
		</style>
	</head>
	<body>
		<a class="skip" href="#contenu">Aller au contenu principal</a>
		<header><div class="header-inner">Coursely</div></header>
		<main id="contenu" tabindex="-1">
			<div class="content">
				<span class="status">Erreur %sveltekit.status%</span>
				<h1>Coursely ne peut pas afficher cette page</h1>
				<p>Une erreur empêche le chargement. Réessayez dans un instant ou retournez à l’accueil.</p>
				<div class="actions">
					<a class="button primary" href="">Réessayer</a>
					<a class="button" href="/">Retour à l’accueil</a>
				</div>
			</div>
		</main>
	</body>
</html>
